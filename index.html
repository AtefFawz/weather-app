<!doctype html>
<html lang="en" dir="ltr" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Aether — the weather, as a living sky</title>
    <meta
      name="description"
      content="Aether turns real-time weather data into a living sky. Explore current conditions and the forecast ahead."
    />
    <meta name="theme-color" id="theme-color" content="#0b1026" />
    <meta name="application-name" content="Aether" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Aether" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="icon" href="%BASE_URL%favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="%BASE_URL%icons/icon-192.png" sizes="192x192" type="image/png" />
    <link rel="mask-icon" href="%BASE_URL%icons/icon-badge.svg" color="#79cde4" />
    <link rel="apple-touch-icon" sizes="180x180" href="%BASE_URL%icons/apple-touch-icon.png" />
    <link
      rel="apple-touch-startup-image"
      href="%BASE_URL%launch/launch-1170x2532.png"
      media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3)"
    />
    <link
      rel="apple-touch-startup-image"
      href="%BASE_URL%launch/launch-1179x2556.png"
      media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3)"
    />
    <link
      rel="apple-touch-startup-image"
      href="%BASE_URL%launch/launch-1290x2796.png"
      media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3)"
    />
    <link
      rel="apple-touch-startup-image"
      href="%BASE_URL%launch/launch-1080x2340.png"
      media="(device-width: 360px) and (device-height: 780px) and (-webkit-device-pixel-ratio: 3)"
    />
    <link
      rel="apple-touch-startup-image"
      href="%BASE_URL%launch/launch-828x1792.png"
      media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2)"
    />
    <link
      rel="apple-touch-startup-image"
      href="%BASE_URL%launch/launch-2048x2732.png"
      media="(device-width: 1024px) and (device-height: 1366px) and (-webkit-device-pixel-ratio: 2)"
    />
    <script>
      // Apply saved language/theme before first paint to avoid a flash. Mirrors state/app-state.ts.
      try {
        var raw = localStorage.getItem("aether:v2:state");
        var s = raw ? JSON.parse(raw) : null;
        var d = document.documentElement;
        var st = s && (s.state || s);
        var lang = st && st.language === "ar" ? "ar" : "en";
        var pref = st && st.theme;
        var light = pref === "light" || (pref !== "dark" && window.matchMedia("(prefers-color-scheme: light)").matches);
        d.lang = lang;
        d.dir = lang === "ar" ? "rtl" : "ltr";
        d.dataset.theme = light ? "light" : "dark";
        var themeMeta = document.querySelector('meta[name="theme-color"]');
        if (themeMeta) themeMeta.content = light ? "#eaf1f6" : "#0b1026";
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Aether needs JavaScript to draw the sky and load the forecast.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
